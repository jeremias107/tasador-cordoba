services:
  - type: web
    name: tasador-cordoba
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: MI_WHATSAPP
        sync: false
